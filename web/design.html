<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>技术方案设计 · Agent Lab</title><link rel="stylesheet" href="/static/design.css?v=canvas-layout-2"><script src="/static/design.js?v=canvas-layout-2" defer></script></head><body>
<header><a href="/">← 需求澄清</a><strong>Agent Lab <span>03 / 技术方案设计</span></strong><span id="mode"></span></header>
<main><section class="intro"><div><p class="eyebrow">DESIGN STUDIO</p><h1>把你的想法，搭成一个方案。</h1><p>先表达流程，再决定实现。你负责取舍，技术负责人帮你检验。</p></div><div><label for="session">选择练习</label><select id="session"></select><label for="version">已定稿的需求文档</label><select id="version"></select><button id="open">开始 / 继续设计</button></div></section>
<p id="notice" role="status">正在读取练习…</p>
<section id="studio" hidden><div class="toolbar"><strong id="design-title"></strong><span id="save-status"></span><button id="save">保存方案</button><button id="export">导出方案 Markdown</button><button id="backup">下载当前草稿 JSON</button></div>
<div class="columns"><aside class="panel requirements-panel"><h2>需求与约束</h2><p id="source-info"></p><div id="requirements" tabindex="0" role="region" aria-label="需求与约束内容"></div><details><summary>设计提示</summary><p>哪些需求由哪些步骤覆盖？信息缺失时如何追问？模型和代码如何分工？工具失败能否重试？何时由人确认？</p><p>节点可以暂未设计。连线支持自然语言条件与回路；有回路时需要解释退出条件。</p></details></aside>
<section class="panel center"><div class="toolbar"><button id="canvas-mode" aria-pressed="true">画布模式</button><button id="list-mode" aria-pressed="false">步骤列表</button><button id="add">＋ 添加步骤</button></div>
<div id="canvas-wrap"><svg id="canvas" viewBox="0 0 1100 1000" aria-label="技术方案流程画布"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#759784"/></marker></defs><g id="edges"></g><g id="nodes"></g></svg></div><div id="list" hidden></div>
<div class="group-tools"><label for="group">所属 Agent（可选，不是每个步骤都需要 Agent）</label><input id="group" maxlength="120" placeholder="例如：信息收集 Agent"><div class="group-actions"><button id="assign">分配给选中节点</button><button id="add-edge">＋ 添加连线</button><span id="selection"></span></div></div>
<dialog id="edge-dialog"><h2>编辑连线</h2><div id="connections"></div><form method="dialog"><button>完成</button></form></dialog>
<section class="decision-record"><label for="decisions">我的决策记录</label><textarea id="decisions" rows="3" maxlength="8000" placeholder="记录方案取舍、未决事项，以及为什么采纳或不采纳评审建议。"></textarea></section></section>
<aside class="panel"><h2>节点设计</h2><p id="selected-title"></p><form id="node-form"><label>步骤名称<input id="node-title" maxlength="120" required></label><label>执行方式<select id="node-executor"><option>待决定</option><option>模型</option><option>普通代码</option><option>人工</option></select></label><label>需要的输入<textarea id="node-inputs" rows="2" maxlength="2000"></textarea></label><label>产生的输出<textarea id="node-outputs" rows="2" maxlength="2000"></textarea></label><label>工具与知识来源<textarea id="node-tools" rows="2" maxlength="2000"></textarea></label><label>失败或不确定怎么办<textarea id="node-failure" rows="2" maxlength="2000"></textarea></label><label>所属 Agent<input id="node-agent" maxlength="120"></label><label>设计理由<textarea id="node-rationale" rows="2" maxlength="2000"></textarea></label><button type="button" id="delete-node">删除选中步骤</button></form>
</aside></div>
<section class="panel review"><div><h2>技术负责人评审</h2><p>先保存你自己的设计，再讨论具体取舍。评审建议不会自动修改方案。</p></div><form id="review-form"><label for="scope">讨论范围</label><select id="scope"><option value="all">整体方案</option><option value="node">当前节点</option></select><label for="question">你想讨论什么？</label><textarea id="question" rows="2" maxlength="4000" placeholder="例如：这一步该用普通代码还是模型？我这样拆分 Agent 合理吗？" required></textarea><button id="ask" type="submit">保存并发起评审</button></form><div id="reviews"></div></section></section></main></body></html>
